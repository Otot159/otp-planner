            style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border2);
            background:var(--surface2);color:var(--text);font-size:13px;font-family:inherit;outline:none;

function showProposal(originalHTML, improvedHTML) {
  const overlay = document.createElement('div');
  overlay.className = 'proposal-overlay';
  overlay.id = 'proposalOverlay';
  overlay.innerHTML = `
    <div class="proposal-modal">
      <div class="proposal-header">
        <h3>Review Changes</h3>
        <div class="proposal-tabs">
          <button class="proposal-tab active" onclick="proposalView('compare',this)">Compare</button>
          <button class="proposal-tab" onclick="proposalView('improved',this)">Improved Only</button>
        </div>
        <span class="proposal-badge">Proposal</span>
      </div>
      <div class="proposal-body" id="proposalBody">
        <div class="proposal-compare">
          <div class="proposal-pane proposal-pane-left">
            <div class="proposal-pane-label original">Original</div>
            <div class="proposal-content">${originalHTML}</div>
          </div>
          <div class="proposal-pane">
            <div class="proposal-pane-label improved">Improved</div>
            <div class="proposal-content">${improvedHTML}</div>
          </div>
        </div>
      </div>
      <div class="proposal-footer">
        <button class="proposal-btn proposal-btn-deny" onclick="denyProposal()">Deny</button>
        <button class="proposal-btn proposal-btn-accept" onclick="acceptProposal()">Accept</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  // Sync scroll between panes
  const panes = overlay.querySelectorAll('.proposal-pane');
  if (panes.length === 2) {
    let syncing = false;
    panes.forEach((pane, i) => {
      pane.addEventListener('scroll', () => {
        if (syncing) return;
        syncing = true;
        const other = panes[1 - i];
        other.scrollTop = pane.scrollTop;
        syncing = false;
      });
    });
  }
}

function proposalView(mode, btn) {
  btn.parentElement.querySelectorAll('.proposal-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const body = document.getElementById('proposalBody');
  if (mode === 'compare') {
    body.innerHTML = `
      <div class="proposal-compare">
        <div class="proposal-pane proposal-pane-left">
          <div class="proposal-pane-label original">Original</div>
          <div class="proposal-content">${claudeOriginalContent}</div>
        </div>
        <div class="proposal-pane">
          <div class="proposal-pane-label improved">Improved</div>
          <div class="proposal-content">${claudeProposedContent}</div>
        </div>
      </div>`;
    const panes = body.querySelectorAll('.proposal-pane');
    let syncing = false;
    panes.forEach((pane, i) => {
      pane.addEventListener('scroll', () => {
        if (syncing) return;
        syncing = true;
        panes[1 - i].scrollTop = pane.scrollTop;
        syncing = false;
      });
    });
  } else {
    body.innerHTML = `
      <div class="proposal-single">
        <div class="proposal-content">${claudeProposedContent}</div>
      </div>`;
  }
}

function acceptProposal() {
  if (claudeProposedContent && claudeProposalNoteId) {
    document.getElementById('noteContent').innerHTML = claudeProposedContent;
    autoSaveNote(claudeProposalNoteId);
    showToast('Changes applied', 'success');
  }
  document.getElementById('proposalOverlay')?.remove();
  claudeProposalNoteId = null;
  claudeProposedContent = null;
}

function denyProposal() {
  document.getElementById('proposalOverlay')?.remove();
  claudeProposalNoteId = null;
  claudeProposedContent = null;
  showToast('Changes discarded', 'info');
}

async function toggleNoteStatus(noteId) {
  const note = await window.api.getTaskNote(noteId);
  if (!note) return;
  const newStatus = (note.status || 'open') === 'done' ? 'open' : 'done';
  await window.api.updateTaskNote(noteId, { status: newStatus });
  // Update editor button if visible
  const btn = document.getElementById('editorDoneBtn');
  if (btn) {
    btn.textContent = newStatus === 'done' ? 'Done' : 'Mark Done';
    btn.classList.toggle('is-done', newStatus === 'done');
  }
  await renderSidebar();
  showToast(newStatus === 'done' ? 'Task marked as done' : 'Task reopened', 'success');
}

// ═══ VOICE DICTATION ═══
let isDictating = false;
let _dictStream = null, _dictCtx = null, _dictSource = null, _dictProcessor = null, _dictChunks = [];

async function toggleDictation() {
  const editor = document.getElementById('noteContent');
  if (!editor) return;
  const btn = document.getElementById('micBtn');

  if (isDictating) {
    // Stop recording
    isDictating = false;
    btn?.classList.remove('recording');
    if (_dictStream) _dictStream.getTracks().forEach(t => t.stop());
    _dictProcessor?.disconnect();
    _dictSource?.disconnect();

    // Show processing state
    btn.style.opacity = '0.5';
    btn.title = 'Transcribing...';

    // Encode PCM to WAV
    const length = _dictChunks.reduce((a, c) => a + c.length, 0);
    if (length === 0) { btn.style.opacity = ''; btn.title = 'Voice dictation'; return; }
    const pcm = new Float32Array(length);
    let off = 0;
    for (const c of _dictChunks) { pcm.set(c, off); off += c.length; }
    const wav = encodeWAV(pcm, 16000);

    // Send to main for transcription
    try {
      const text = await window.api.transcribeAudio(Array.from(new Uint8Array(wav)));
      if (text && text.trim()) {
        editor.focus();
        restoreSelection();
        document.execCommand('insertText', false, text);
        saveSelection();
        const noteId = currentView.split('-')[2];
        if (noteId) autoSaveNote(parseInt(noteId));
      }
    } catch(e) {
      console.error('Transcription failed:', e);
    }
    btn.style.opacity = '';
    btn.title = 'Voice dictation';
    _dictCtx?.close();
  } else {
    // Start recording
    try {
      _dictChunks = [];
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true } });
      const ctx = new AudioContext({ sampleRate: 16000 });
      const source = ctx.createMediaStreamSource(stream);
      const processor = ctx.createScriptProcessorNode(4096, 1, 1);
      processor.onaudioprocess = (e) => {
        _dictChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
      };
      source.connect(processor);
      processor.connect(ctx.destination);
      _dictStream = stream; _dictCtx = ctx; _dictSource = source; _dictProcessor = processor;
      isDictating = true;
      editor.focus();
      saveSelection();
      btn?.classList.add('recording');
    } catch(e) {
      alert('Microphone access denied. Grant microphone permission in System Settings → Privacy & Security → Microphone.');
    }
  }
}

function encodeWAV(samples, sampleRate) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  writeStr(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true);
  writeStr(8, 'WAVE'); writeStr(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  writeStr(36, 'data'); v.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return buf;
}

function applyHeading(tag) {
  const editor = document.getElementById('noteContent');
  if (!editor) return;
  const sel = window.getSelection();
  if (!sel.rangeCount) return;

  // Get all block-level parent elements in the selection
  const range = sel.getRangeAt(0);
  const startNode = range.startContainer;
  const endNode = range.endContainer;

  // Find all block elements that intersect the selection
  const blocks = [];
  const walker = document.createTreeWalker(editor, NodeFilter.SHOW_ELEMENT, {
    acceptNode(node) {
      const blockTags = ['P','H1','H2','H3','H4','H5','H6','DIV','BLOCKQUOTE','PRE','LI'];
      if (!blockTags.includes(node.tagName)) return NodeFilter.FILTER_SKIP;
      if (sel.containsNode(node, true)) return NodeFilter.FILTER_ACCEPT;
      return NodeFilter.FILTER_SKIP;
    }
  });
  while (walker.nextNode()) blocks.push(walker.currentNode);

  if (blocks.length <= 1) {
    // Single block or no blocks — use formatBlock
    document.execCommand('formatBlock', false, `<${tag}>`);
  } else {
    // Multiple blocks — apply to each
    blocks.forEach(block => {
      const newEl = document.createElement(tag);
      newEl.innerHTML = block.innerHTML;
      // Copy over inline styles if any
      if (block.style.cssText) newEl.style.cssText = block.style.cssText;
      block.parentNode.replaceChild(newEl, block);
    });
  }
  editor.focus();
  const noteId = currentView.split('-')[2];
  if (noteId) autoSaveNote(parseInt(noteId));
}

function handleImageUpload(event, noteId) {
  const files = event.target.files;
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    const reader = new FileReader();
    reader.onload = e => {
      insertImageAtCursor(e.target.result, noteId);
    };
    reader.readAsDataURL(file);
  }
  event.target.value = '';
}

function handleImageDrop(event, noteId) {
  event.preventDefault();
  const files = event.dataTransfer.files;
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    const reader = new FileReader();
    reader.onload = e => {
      insertImageAtCursor(e.target.result, noteId);
    };
    reader.readAsDataURL(file);
  }
  // Also handle dragged images from browser
  const html = event.dataTransfer.getData('text/html');
  if (html && html.includes('<img')) {
    document.execCommand('insertHTML', false, html);
    autoSaveNote(noteId);
  }
}

function insertImageAtCursor(src, noteId) {
  const editor = document.getElementById('noteContent');
  editor.focus();
  const img = `<img src="${src}" style="width:50%;cursor:pointer;" onclick="selectImage(this)">`;
  document.execCommand('insertHTML', false, img + '<br>');
  autoSaveNote(noteId);
}

function applyHighlight(color) {
  closeAllPopups();
  if (color === 'transparent') {
    // Remove highlight: find and strip background from selected spans
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    const container = range.commonAncestorContainer;
    const root = container.nodeType === 3 ? container.parentElement : container;
    // Find all elements with background in the selection
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT);
    const toClean = [];
    while (walker.nextNode()) {
      const node = walker.currentNode;
      if (node.style && node.style.backgroundColor && sel.containsNode(node, true)) {
        toClean.push(node);
      }
    }
    // Also check the root itself
    if (root.style && root.style.backgroundColor && sel.containsNode(root, true)) {
      toClean.push(root);
    }
    toClean.forEach(el => {
      el.style.backgroundColor = '';
      // If span has no remaining styles, unwrap it
      if (el.tagName === 'SPAN' && !el.getAttribute('style')?.trim()) {
        const parent = el.parentNode;
        while (el.firstChild) parent.insertBefore(el.firstChild, el);
        parent.removeChild(el);
      }
    });
    const noteId = currentView.split('-')[2];
    if (noteId) autoSaveNote(parseInt(noteId));
  } else {
    execCmd('hiliteColor', color);
  }
  document.getElementById('noteContent')?.focus();
}

  const grid = document.getElementById('emojiGrid');
  grid.innerHTML = '';
  const q = (filter || '').toLowerCase();
  emojiCategories.forEach(cat => {
    const items = q ? cat.items.filter(() => cat.name.toLowerCase().includes(q)) : cat.items;
    if (q && items.length === 0) return;
    const filtered = q ? cat.items : items;
    const label = document.createElement('div');
    label.className = 'emoji-picker-cat';
    label.textContent = cat.name;
    grid.appendChild(label);
    filtered.forEach(emoji => {
      const btn = document.createElement('button');
      btn.textContent = emoji;
      btn.title = emoji;
      btn.onclick = () => insertEmoji(emoji);
      grid.appendChild(btn);
    });
  });
}

function filterEmojis(q) {
  const grid = document.getElementById('emojiGrid');
  grid.innerHTML = '';
  const query = q.toLowerCase();
  emojiCategories.forEach(cat => {
    // Filter: match category name or show all if query matches
    const catMatch = cat.name.toLowerCase().includes(query);
    if (!catMatch && query) return;
    const label = document.createElement('div');
    label.className = 'emoji-picker-cat';
    label.textContent = cat.name;
    grid.appendChild(label);
    cat.items.forEach(emoji => {
      const btn = document.createElement('button');
      btn.textContent = emoji;
      btn.title = emoji;
      btn.onclick = () => insertEmoji(emoji);
      grid.appendChild(btn);
    });
  });
}

function insertEmoji(emoji) {
  closeAllPopups();
  const editor = document.getElementById('noteContent');
  editor.focus();
  restoreSelection();
  document.execCommand('insertText', false, emoji);
  _savedRange = null;
  const noteId = currentView.split('-')[2];
  if (noteId) autoSaveNote(parseInt(noteId));
}

// Close all popups on outside click
function closeAllPopups() {
  document.querySelectorAll('.color-picker-popup, .table-picker-popup, .emoji-picker-popup').forEach(p => p.classList.remove('open'));
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.color-picker-wrap') && !e.target.closest('.table-picker-wrap') && !e.target.closest('.emoji-picker-wrap')) {
    closeAllPopups();
  }
});

// ═══ TAB KEY: tables + list indentation ═══
const listMarkers = ['disc', 'circle', 'square'];
const olMarkers = ['decimal', 'lower-alpha', 'lower-roman'];

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Tab') return;
  const editor = document.getElementById('noteContent');
  if (!editor || !editor.contains(document.activeElement) && document.activeElement !== editor) return;

  // Tab in table → move to next cell
  const tableCell = e.target.closest?.('.editor-area td, .editor-area th') ||
    window.getSelection()?.anchorNode?.parentElement?.closest?.('td, th');
  if (tableCell && tableCell.closest('.editor-area')) {
    e.preventDefault();
    const cells = [...tableCell.closest('table').querySelectorAll('td, th')];
    const idx = cells.indexOf(tableCell);
    if (idx >= 0) {
      const next = e.shiftKey ? cells[idx - 1] : cells[idx + 1];
      if (next) { next.focus(); }
      else if (!e.shiftKey) {
        const row = tableCell.closest('tr');
        const newRow = row.cloneNode(true);
        newRow.querySelectorAll('td, th').forEach(c => { c.textContent = ''; c.setAttribute('contenteditable','true'); });
        newRow.querySelectorAll('th').forEach(th => {
          const td = document.createElement('td');
          td.setAttribute('contenteditable','true');
          th.replaceWith(td);
        });
        row.parentNode.appendChild(newRow);
        newRow.querySelector('td')?.focus();
        const noteId = currentView.split('-')[2];
        if (noteId) autoSaveNote(parseInt(noteId));
      }
    }
    return;
  }

  // Tab in list → indent/outdent with different markers
  const sel = window.getSelection();
  const li = sel?.anchorNode?.parentElement?.closest?.('li') ||
    (sel?.anchorNode?.nodeType === 1 && sel.anchorNode.closest?.('li'));
  if (li && li.closest('.editor-area')) {
    e.preventDefault();
    if (e.shiftKey) {
      execCmd('outdent');
    } else {
      execCmd('indent');
    }
    // Apply different bullet/number style based on nesting depth
    setTimeout(() => {
      const updatedLi = window.getSelection()?.anchorNode?.parentElement?.closest?.('li') ||
        (window.getSelection()?.anchorNode?.nodeType === 1 && window.getSelection().anchorNode.closest?.('li'));
      if (!updatedLi) return;
      let depth = 0;
      let parent = updatedLi.parentElement;
      while (parent && parent.closest('.editor-area')) {
        if (parent.tagName === 'UL' || parent.tagName === 'OL') depth++;
        parent = parent.parentElement;
      }
      const list = updatedLi.closest('ul, ol');
      if (!list) return;
      if (list.tagName === 'UL') {
        list.style.listStyleType = listMarkers[(depth - 1) % listMarkers.length];
      } else {
        list.style.listStyleType = olMarkers[(depth - 1) % olMarkers.length];
      }
    }, 10);
    return;
  }
});

function autoSaveNote(noteId) {
  const indicator = document.getElementById('saveIndicator');
  if (indicator) { indicator.textContent = 'Saving...'; indicator.classList.add('saving'); }
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    const title = document.getElementById('noteTitle')?.value || '';
    const content = document.getElementById('noteContent')?.innerHTML || '';
    const updates = { title, content };
    const projectEl = document.getElementById('noteProject');
    if (projectEl) updates.client_id = projectEl.value ? parseInt(projectEl.value) : null;
    await window.api.updateTaskNote(noteId, updates);
    if (indicator) { indicator.textContent = 'Saved'; indicator.classList.remove('saving'); }
    renderSidebar(); // update badge count
  }, 400);
}

// ═══ SINGLE PROJECT VIEW ═══
async function renderProjectView(page, clientId) {
  const key = dateKey(currentDate);
  const data = await window.api.getDayData(key);
  const client = data.find(c=>c.id===clientId);
  if (!client) { page.innerHTML='<div class="empty" style="padding:40px;text-align:center;">Project not found.</div>'; return; }
  let html = `<div class="project-view">
    <div class="project-view-header">
      <div class="project-view-color" style="background:${client.color}"></div>
      <h2>${client.name}</h2>
      <button class="tool-btn" onclick="showEditProject(${client.id})" style="margin-left:auto">Edit</button>
    </div>`;
  for (const sec of client.sections) {
    html += `<div class="project-section"><div class="project-section-title">${sec.name}
      <button class="add-btn" onclick="showAddInput(${sec.id},'${key}')">+</button></div>`;
    if (!sec.items.length) html += '<div class="empty">—</div>';
    else { for (const item of sec.items) { html+=renderItem(item,false); if(item.sub) for(const s of item.sub) html+=renderItem(s,true); } }
    html += `<div id="add-${sec.id}"></div></div>`;
  }
  html += '</div>';
  page.innerHTML = html;
}

// ═══ ITEM ACTIONS ═══
async function cycleStatus(id,cur) { await window.api.updateStatus(id,stateList[(stateList.indexOf(cur)+1)%stateList.length]); renderPage(); }
async function deleteItem(id) { await window.api.deleteItem(id); renderPage(); }
function startEdit(el, itemId) {
  el.contentEditable=true; el.focus();
  const r=document.createRange(); r.selectNodeContents(el);
  const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
  async function finish() { el.contentEditable=false; const t=el.textContent.trim();
    if(!t) await window.api.deleteItem(itemId); else await window.api.updateText(itemId,t); renderPage(); }
  el.onblur=finish;
  el.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();el.blur();} if(e.key==='Escape'){el.contentEditable=false;renderPage();} };
}
function showAddInput(sectionId,date) {
  const c=document.getElementById(`add-${sectionId}`);
  c.innerHTML=`<div class="add-input-row"><input class="add-input" placeholder="Type and press Enter..." autofocus
    onkeydown="handleAddKey(event,${sectionId},'${date}')"></div>`;
  c.querySelector('input').focus();
}
async function handleAddKey(e,sectionId,date) {
  if(e.key==='Enter'&&e.target.value.trim()) {
    await window.api.addItem(sectionId,date,e.target.value.trim(),null);
    e.target.value=''; renderPage(); setTimeout(()=>showAddInput(sectionId,date),50);
  }
  if(e.key==='Escape') renderPage();
}

// ═══ COLUMN MENU ═══
function toggleColMenu(e,id) { e.stopPropagation(); closeDropdowns();
  const m=document.getElementById(`col-menu-${id}`); m.style.display=m.style.display==='none'?'block':'none'; openDropdown=m; }
function closeDropdowns() { if(openDropdown){openDropdown.style.display='none';openDropdown=null;} }
document.addEventListener('click',closeDropdowns);

// ═══ PROJECT MODALS ═══
function showAddProject() {
  const mc=document.getElementById('modalContainer');
  mc.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h2>New Project</h2>
    <div class="modal-field"><label>Project Name</label>
      <input class="modal-input" id="newProjectName" placeholder="e.g. Client Name" autofocus></div>
    <div class="modal-field"><label>Color</label>
      <div class="color-picker">${availableColors.map((c,i)=>`<div class="color-dot${i===0?' selected':''}" style="background:${c}" data-color="${c}" onclick="selectColor(this)"></div>`).join('')}</div></div>
    <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="createProject()">Create</button></div>
  </div></div>`;
  document.getElementById('newProjectName').focus();
  document.getElementById('newProjectName').onkeydown=e=>{if(e.key==='Enter')createProject();};
}
function selectColor(el) { document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('selected')); el.classList.add('selected'); }
async function createProject() {
  const name=document.getElementById('newProjectName').value.trim();
  const color=document.querySelector('.color-dot.selected')?.dataset.color||'#1e3a5f';
  if(!name)return; await window.api.addClient(name,color); closeModal(); render(); statusMsg(`${name} created`);
}
async function showEditProject(id) {
  closeDropdowns(); const clients=await window.api.getClients(true); const c=clients.find(x=>x.id===id); if(!c)return;
  const mc=document.getElementById('modalContainer');
  mc.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h2>Edit Project</h2>
    <div class="modal-field"><label>Name</label><input class="modal-input" id="editProjectName" value="${c.name}"></div>
    <div class="modal-field"><label>Color</label>
      <div class="color-picker">${availableColors.map(x=>`<div class="color-dot${x===c.color?' selected':''}" style="background:${x}" data-color="${x}" onclick="selectColor(this)"></div>`).join('')}</div></div>
    <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveProject(${id})">Save</button></div>
  </div></div>`;
}
async function saveProject(id) {
  const name=document.getElementById('editProjectName').value.trim();
  const color=document.querySelector('.color-dot.selected')?.dataset.color;
  if(!name)return; await window.api.updateClient(id,{name,color}); closeModal(); render(); statusMsg('Updated');
}
async function archiveProject(id) {
  closeDropdowns(); await window.api.updateClient(id,{archived:true});
  if(currentView==='project-'+id)currentView='overview'; render(); statusMsg('Archived');
}
async function confirmDeleteProject(id) {
  closeDropdowns(); const clients=await window.api.getClients(true); const c=clients.find(x=>x.id===id);
  const mc=document.getElementById('modalContainer');
  mc.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h2>Delete "${c.name}"?</h2>
    <p style="color:var(--text2);font-size:13px;margin-bottom:18px;">This permanently deletes the project and all its data.</p>
    <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-secondary" onclick="archiveProject(${id});closeModal()">Archive</button>
      <button class="btn btn-danger" onclick="deleteProject(${id})">Delete</button></div>
  </div></div>`;
}
async function deleteProject(id) {
  await window.api.deleteClient(id); if(currentView==='project-'+id)currentView='overview';
  closeModal(); render(); statusMsg('Deleted');
}
async function showManageProjects() {
  const all=await window.api.getClients(true); const active=all.filter(c=>!c.archived); const archived=all.filter(c=>c.archived);
  const mc=document.getElementById('modalContainer');
  mc.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h2>Manage Projects</h2>
    <div class="project-list">${active.map(c=>`<div class="project-card">
      <div class="project-color-bar" style="background:${c.color}"></div>
      <div class="project-name">${c.name}</div>
      <button class="project-action" onclick="showEditProject(${c.id})">Edit</button>
      <button class="project-action" onclick="archiveProject(${c.id});showManageProjects()">Archive</button>
    </div>`).join('')}</div>
    ${archived.length?`<div class="sidebar-label" style="padding-left:0;margin-top:14px">Archived</div>
      <div class="project-list">${archived.map(c=>`<div class="project-card">
        <div class="project-color-bar" style="background:${c.color};opacity:0.4"></div>
        <div class="project-name archived">${c.name}</div>
        <button class="project-action" onclick="restoreProject(${c.id})">Restore</button>
        <button class="project-action danger" onclick="confirmDeleteProject(${c.id})">Delete</button>
      </div>`).join('')}</div>`:''}
    <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Done</button>
      <button class="btn btn-primary" onclick="closeModal();showAddProject()">+ New</button></div>
  </div></div>`;
}
async function restoreProject(id) { await window.api.updateClient(id,{archived:false}); showManageProjects(); statusMsg('Restored'); }
function closeModal() { document.getElementById('modalContainer').innerHTML=''; }

// ═══ NAVIGATION ═══
function changeWeek(o) { currentDate.setDate(currentDate.getDate()+(o*7)); render(); }
function goToday() { currentDate=new Date(todayDate.getFullYear(), todayDate.getMonth(), todayDate.getDate()); render(); }
function goToDate(y,m,d) { currentDate=new Date(y,m,d); render(); }

// ═══ EXPORT / IMPORT ═══
async function doExport() {
  const d=await window.api.exportData();
  const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='otp-backup-'+dateKey(new Date())+'.json'; a.click(); URL.revokeObjectURL(a.href); statusMsg('Exported');
}
async function doImport(event) {
  const f=event.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=async e=>{ try{await window.api.importData(JSON.parse(e.target.result));render();statusMsg('Imported');}catch{alert('Invalid file');} };
  r.readAsText(f); event.target.value='';
}

// ═══ KEYBOARD ═══
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.contentEditable==='true')return;
  if(e.key==='ArrowLeft') changeDay(-1);
  if(e.key==='ArrowRight') changeDay(1);
  if(e.key==='t'||e.key==='T') goToday();
  if(e.key==='Escape') closeModal();
});

// ═══ POMODORO ═══
function togglePomodoro() {
  pomoState.active = !pomoState.active;
  if (pomoState.active) {
    window.api.pomoOpen();
  } else {
    window.api.pomoClose();
  }
  renderSidebar();
}
// Listen for close from the pomo window itself
window.api?.onPomoClosed?.(() => { pomoState.active = false; renderSidebar(); });

render();
</script>
